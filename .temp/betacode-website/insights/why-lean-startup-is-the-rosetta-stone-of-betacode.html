<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betacode — Insights</title>
<link rel="icon" href="../assets/brand/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1C51}a:hover{color:#D8402F}
.site{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-width:0}
.site a{color:var(--text)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.mono[aria-hidden="true"]{white-space:nowrap;flex:none}
.disp{font-family:'Montserrat',system-ui,sans-serif}
.navlink{color:var(--text) !important;text-decoration:none;font-size:15px;font-weight:500;padding:12px 2px;border-bottom:2px solid transparent}
.navlink:hover{border-bottom-color:#EB5648}
.navlink.on{color:#D8402F !important;border-bottom-color:#EB5648}
.flink{color:var(--fm) !important;text-decoration:none;font-size:15px;padding:8px 0}
.flink:hover{color:var(--ft) !important}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;cursor:pointer;background:transparent;color:var(--muted);font:600 13px/1 'JetBrains Mono',monospace;min-width:44px;min-height:38px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{appearance:none;cursor:pointer;border:0;background:var(--surface);color:var(--text);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.btn-coral{appearance:none;border:0;cursor:pointer;background:#D8402F;color:#FFFFFF !important;text-decoration:none;font:600 15px/1 'Inter',sans-serif;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px}
.btn-coral:hover{background:#BF3424}
.btn-line{appearance:none;cursor:pointer;background:transparent;border:1.5px solid currentColor;text-decoration:none;font:600 15px/1 'Inter',sans-serif;border-radius:12px;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 22px}
.chip{font:500 12px/1 'JetBrains Mono',monospace;padding:7px 11px;border-radius:999px;background:var(--surface);color:var(--text);white-space:nowrap}
.cover{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:28px;box-sizing:border-box;background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.6px);background-size:16px 16px}
.cover-code{font:500 20px/1.6 'JetBrains Mono',monospace;color:#fff;white-space:pre}
.prose{font-size:18px;line-height:1.75;color:var(--text)}
.prose p{margin:0}
.prose h2{font-family:'Montserrat',system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:20px 0 0;scroll-margin-top:90px}
.prose ul,.prose ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px}
.prose li::marker{color:#EB5648;font-weight:700}
.toc a{display:flex;gap:10px;text-decoration:none;font-size:14px;line-height:1.4;padding:8px 0;color:var(--muted) !important;border-bottom:1px solid var(--border)}
.toc a:hover{color:var(--text) !important}
.rel{text-decoration:none;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:transform .2s, box-shadow .2s}
.rel:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(27,28,81,.12)}
.logo-static{display:none}
@media (prefers-reduced-motion:reduce){.logo-anim{display:none !important}.logo-static{display:block}.rel{transition:none}}
@media (max-width:760px){.hide-sm{display:none !important}.hero-h{font-size:34px !important}.prose{font-size:17px}.prose h2{font-size:23px}}
</style>
<style>html,body{margin:0}#root{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-tpl">
<div class="site" style="{{rootStyle}}">

  <!-- NAV -->
  <header style="position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border)">
    <nav aria-label="{{t.navLabel}}" style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap">
      <a href="{{base}}" aria-label="Betacode" style="display: flex; align-items: center; min-height: 44px">
        <img class="logo-anim" src="../assets/brand/logo-animated.gif" alt="Betacode" style="{{logoAnimStyle}}">
        <img class="logo-static" src="{{logo}}" alt="Betacode" style="height: 34px; width: auto">
      </a>
      <div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
        <a class="navlink" href="{{base}}">{{t.navHome}}</a>
        <a class="navlink" href="{{links.pricing}}">{{t.navPricing}}</a>
        <a class="navlink" href="{{links.ventures}}">Betacode Ventures</a>
        <a class="navlink on" href="/Insights.dc.html">Insights</a>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="seg" role="group" aria-label="{{t.langLabel}}">
          <button aria-pressed="{{isPt}}" onClick="{{setPt}}">PT</button>
          <button aria-pressed="{{isEn}}" onClick="{{setEn}}">EN</button>
        </div>
        <button class="iconbtn" aria-label="{{t.themeLabel}}" onClick="{{toggleTheme}}">
          <sc-if value="{{dark}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </sc-if>
          <sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </button>
        <a class="btn-coral" href="{{links.contact}}" style="min-height: 44px; padding: 0 20px">{{t.navContact}}</a>
      </div>
    </nav>
  </header>

  <!-- ARTICLE HEADER -->
  <article>
    <header style="max-width: 1040px; margin: 0 auto; padding: 48px 24px 0; display: flex; flex-direction: column; gap: 22px">
      <nav aria-label="{{t.crumbs}}" style="display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted)">
        <a href="/Insights.dc.html" style="color: var(--muted) !important; text-decoration: none; min-height: 32px; display: inline-flex; align-items: center">← Insights</a>
        <span aria-hidden="true">/</span>
        <span>{{a.cat}}</span>
      </nav>
      <h1 class="disp hero-h" style="margin: 0; font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; max-width: 900px">{{a.title}}</h1>
      <p style="margin: 0; font-size: 21px; line-height: 1.55; color: var(--muted); max-width: 820px">{{a.lead}}</p>
      <div style="display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding-top: 4px">
        <span style="display: flex; align-items: center; gap: 12px">
          <img src="{{au.av}}" alt="" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: {{au.pos}}; display: block">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{au.name}}</span><span style="font-size: 13px; color: var(--muted)">{{au.role}}</span></span>
        </span>
        <span class="mono" style="font-size: 13px; color: var(--muted)">{{a.date}} · {{a.mins}}</span>
      </div>
      <div class="cover" aria-hidden="true" style="{{a.coverStyle}}; height: 320px; border-radius: 26px; margin-top: 10px">
        <span class="mono" style="position: absolute; right: -10px; top: -50px; font-size: 300px; line-height: 1; font-weight: 700; color: rgba(255,255,255,0.07)">{{a.glyph}}</span>
        <span class="cover-code">{{a.code}}</span>
      </div>
    </header>

    <!-- BODY -->
    <div style="max-width: 1040px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
      <aside style="flex: 1 1 220px; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 20px">
        <nav class="toc" aria-label="{{t.toc}}" style="display: flex; flex-direction: column">
          <span class="mono" style="font-size: 12px; color: var(--kicker); padding-bottom: 6px">{{t.toc}}</span>
          <sc-for list="{{toc}}" as="s" hint-placeholder-count="5">
            <a href="{{s.href}}"><span class="mono" style="color: #EB5648; font-size: 12px; padding-top: 2px">{{s.n}}</span>{{s.x}}</a>
          </sc-for>
        </nav>
        <div style="background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <span class="mono" style="font-size: 12px; color: var(--kicker)">{{t.keyTake}}</span>
          <sc-for list="{{a.take}}" as="k" hint-placeholder-count="3">
            <span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5"><span class="mono" aria-hidden="true" style="color: #EB5648; font-weight: 700">{ }</span>{{k}}</span>
          </sc-for>
        </div>
      </aside>

      <div class="prose" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="8">
          <sc-if value="{{b.isH}}" hint-placeholder-val="{{ false }}"><h2 id="{{b.id}}"><span class="mono" aria-hidden="true" style="color: #EB5648; font-size: 18px; font-weight: 700; margin-right: 10px">{{b.n}}</span>{{b.x}}</h2></sc-if>
          <sc-if value="{{b.isP}}" hint-placeholder-val="{{ true }}"><p>{{b.x}}</p></sc-if>
          <sc-if value="{{b.isUl}}" hint-placeholder-val="{{ false }}"><ul><sc-for list="{{b.items}}" as="i" hint-placeholder-count="3"><li>{{i}}</li></sc-for></ul></sc-if>
          <sc-if value="{{b.isOl}}" hint-placeholder-val="{{ false }}"><ol><sc-for list="{{b.items}}" as="i" hint-placeholder-count="3"><li>{{i}}</li></sc-for></ol></sc-if>
          <sc-if value="{{b.isQ}}" hint-placeholder-val="{{ false }}">
            <blockquote style="margin: 8px 0; padding: 4px 0 4px 24px; border-left: 4px solid #EB5648; font-family: 'Montserrat', sans-serif; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">{{b.x}}</blockquote>
          </sc-if>
          <sc-if value="{{b.isNote}}" hint-placeholder-val="{{ false }}">
            <div style="background: var(--surface); border-radius: 18px; padding: 20px 22px; display: flex; gap: 14px; font-size: 16px; line-height: 1.6">
              <span class="mono" aria-hidden="true" style="color: #EB5648; font-weight: 700; font-size: 16px">//</span>
              <span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 15px">{{b.h}}</strong><span style="color: var(--muted)">{{b.x}}</span></span>
            </div>
          </sc-if>
        </sc-for>

        <!-- author card -->
        <div style="margin-top: 24px; border: 1px solid var(--border); border-radius: 22px; padding: 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap">
          <img src="{{au.av}}" alt="{{au.name}}" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; object-position: {{au.pos}}; display: block">
          <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
            <span class="mono" style="font-size: 12px; color: var(--kicker)">{{t.writtenBy}}</span>
            <span class="disp" style="font-size: 19px; font-weight: 800">{{au.name}}</span>
            <span style="font-size: 15px; line-height: 1.5; color: var(--muted)">{{au.bio}}</span>
          </div>
        </div>
      </div>
    </div>
  </article>

  <!-- CTA -->
  <section style="max-width: 1040px; margin: 0 auto; padding: 0 24px 72px">
    <div style="background: var(--band); color: #fff; border-radius: 26px; padding: 40px; display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between">
      <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px">
        <span class="mono" style="font-size: 13px; color: #FF8A7D">{{cta.k}}</span>
        <h2 class="disp" style="margin: 0; font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em">{{cta.h}}</h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9CAE6">{{cta.p}}</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <a class="btn-coral" href="{{cta.href}}">{{cta.btn}} <span aria-hidden="true">→</span></a>
        <a class="btn-line" href="{{links.pricing}}" style="color: #fff">{{t.estimate}}</a>
      </div>
    </div>
  </section>

  <!-- RELATED -->
  <section aria-labelledby="rel-h" style="background: var(--surface)">
    <div style="max-width: 1040px; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <h2 id="rel-h" class="disp" style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">{{t.related}}</h2>
        <a href="/Insights.dc.html" style="font-weight: 600; font-size: 15px; text-underline-offset: 4px; min-height: 44px; display: inline-flex; align-items: center">{{t.all}} →</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
        <sc-for list="{{related}}" as="r" hint-placeholder-count="2">
          <a class="rel" href="{{r.href}}">
            <div class="cover" aria-hidden="true" style="{{r.coverStyle}}; height: 130px; padding: 20px"><span class="cover-code" style="font-size: 14px">{{r.code}}</span></div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span class="chip">{{r.cat}}</span><span class="mono" style="font-size: 12px; color: var(--muted)">{{r.mins}}</span></div>
              <span class="disp" style="font-size: 19px; line-height: 1.25; font-weight: 800">{{r.title}}</span>
              <span style="font-size: 14px; font-weight: 700">{{t.read}} →</span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="{{foot.style}}">
    <div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 36px; display: flex; flex-direction: column; gap: 44px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 36px">
        <div style="display: flex; flex-direction: column; gap: 16px; max-width: 320px">
          <img src="{{foot.logo}}" alt="Betacode" style="height: 36px; width: auto; align-self: flex-start; display: block">
          <p style="margin: 0; color: var(--fm); font-size: 15px; line-height: 1.6">{{t.footTag}}</p>
        </div>
        <div style="display: flex; gap: 64px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column">
            <span class="mono" style="font-size: 12px; color: var(--fk); margin-bottom: 10px">{{t.footNav}}</span>
            <a class="flink" href="{{links.pricing}}">{{t.navPricing}}</a>
            <a class="flink" href="{{links.ventures}}">Betacode Ventures</a>
            <a class="flink" href="/Insights.dc.html">Insights</a>
            <a class="flink" href="{{links.contact}}">{{t.navContact}}</a>
          </div>
          <div style="display: flex; flex-direction: column">
            <span class="mono" style="font-size: 12px; color: var(--fk); margin-bottom: 10px">social</span>
            <a class="flink" href="https://www.facebook.com/betacode.tech/">Facebook</a>
            <a class="flink" href="https://www.instagram.com/betacode.tech">Instagram</a>
            <a class="flink" href="https://twitter.com/betacode_tech">X / Twitter</a>
            <a class="flink" href="https://github.com/BetacodeTech">GitHub</a>
          </div>
        </div>
      </div>
      <div style="border-top: 1px solid var(--fb); border-bottom: 1px solid var(--fb); padding: 28px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 40px">
        <div style="display: flex; gap: 28px; flex-wrap: wrap; align-items: center">
          <img src="{{foot.iefp}}" alt="IEFP" style="height: 48px; width: auto; display: block">
          <img src="{{foot.pessoas}}" alt="Pessoas 2030" style="height: 40px; width: auto; display: block">
          <img src="{{foot.pt}}" alt="Portugal 2030" style="height: 44px; width: auto; display: block">
          <img src="{{foot.ue}}" alt="{{t.altEu}}" style="height: 44px; width: auto; display: block">
        </div>
        <p style="margin: 0; flex: 1 1 300px; font-size: 13px; line-height: 1.55; color: var(--fm)">{{t.funding}}</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--fm); font-size: 13px">
        <span>{{t.copy}}</span>
        <span class="mono">{{t.made}}</span>
      </div>
    </div>
  </footer>
</div>
</template>
<script type="text/x-dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, theme: null };
  }
  renderVals() {
    const S = this.state;
    const lang = S.lang || this.props.lang || 'pt';
    const theme = S.theme || this.props.theme || 'light';
    const dark = theme === 'dark';
    const en = lang === 'en';
    const L = (pt, e) => (en ? e : pt);
    const base = 'https://www.betacode.tech/' + lang;
    const links = { pricing: base + '/pricing', ventures: base + '/betacode-ventures', insights: base + '/insights', contact: base + '/contact' };
    const P = dark ? {
      bg: '#0D0E24', surface: '#16173A', card: '#1D1E48', text: '#F2F2FA', muted: '#B9BADB', border: '#272960', border2: '#3A3C7A', band: '#1B1C51', kicker: '#FF8A7D'
    } : {
      bg: '#FFFFFF', surface: '#F4F4F8', card: '#FFFFFF', text: '#1B1C51', muted: '#4A4B7A', border: '#E6E6EF', border2: '#C9CAE0', band: '#1B1C51', kicker: '#B83324'
    };
    const rootStyle = Object.keys(P).map((k) => '--' + k + ':' + P[k]).join(';');

    const t = {
      navLabel: L('Principal', 'Main'), navHome: L('Início', 'Home'), navPricing: L('Preços', 'Pricing'), navContact: L('Contacto', 'Contact'),
      langLabel: L('Idioma', 'Language'), themeLabel: dark ? L('Mudar para modo claro', 'Switch to light mode') : L('Mudar para modo escuro', 'Switch to dark mode'),
      crumbs: L('Navegação estrutural', 'Breadcrumb'), toc: L('Neste artigo', 'In this article'), keyTake: L('Em resumo', 'Key takeaways'),
      writtenBy: L('escrito por', 'written by'), related: L('Continue a ler', 'Keep reading'), all: L('Todos os insights', 'All insights'), read: L('Ler artigo', 'Read article'),
      estimate: L('Estimar preço', 'Estimate price'),
      footTag: L('Equipas de software dedicadas para empresas e startups.', 'Dedicated software teams for businesses and startups.'), footNav: L('navegação', 'navigation'),
      altEu: L('Cofinanciado pela União Europeia', 'Co-funded by the European Union'),
      funding: L('Projeto financiado pelo programa AVANÇAR, no âmbito do Portugal 2030, cofinanciado pelo Fundo Social Europeu Mais (FSE+).', 'Project funded by the AVANÇAR programme under Portugal 2030, co-financed by the European Social Fund Plus (ESF+).'),
      copy: L('© 2026 Betacode, Inc. Todos os direitos reservados.', '© 2026 Betacode, Inc. All rights reserved.'), made: L('{ feito em Portugal }', '{ made in Portugal }')
    };

    const AUTH = {
      marco: { name: 'Marco Mendão', role: 'Co-Founder & CTO', av: '../assets/avatars/marco-mendao.jpg', pos: 'center',
        bio: L('Co-fundador e CTO da Betacode. Escreve sobre arquitetura, engenharia de produto e como usar a tecnologia certa para entregar mais depressa.', 'Co-founder and CTO at Betacode. Writes about architecture, product engineering and using the right technology to ship faster.') },
      pedro: { name: 'Pedro Gorrão', role: 'Co-Founder & CEO', av: '../assets/avatars/pedro-gorrao.jpg', pos: '60% 20%',
        bio: L('Co-fundador e CEO da Betacode. Escreve sobre lean startup, construção de produto e o que aprendemos a lançar empresas com os nossos parceiros.', 'Co-founder and CEO at Betacode. Writes about lean startup, building products and what we learn launching companies with our partners.') }
    };
    const CATS = { eng: L('Engenharia', 'Engineering'), biz: L('Negócio', 'Business'), start: 'Startups', ven: 'Ventures' };
    const COVER = { eng: 'background-color: #1B1C51', biz: 'background-color: #D8402F', start: 'background-color: #2A2C6E', ven: 'background-color: #13143A' };
    const h = (x) => ({ t: 'h', x }), p = (x) => ({ t: 'p', x }), ul = (items) => ({ t: 'ul', items }), ol = (items) => ({ t: 'ol', items }), q = (x) => ({ t: 'q', x }), note = (hh, x) => ({ t: 'note', h: hh, x });

    const ART = {
      agentic: {
        file: 'ArtAgentic.dc.html', cat: 'eng', by: 'marco', mins: 9, date: L('28 out 2026', 'Oct 28, 2026'), glyph: '>_', code: 'agent.plan(task)\n  .run()\n  .review();',
        title: L('A era agêntica do software', 'The agentic era of software'),
        lead: L('Os assistentes de código completavam linhas. Os agentes de hoje recebem uma tarefa, leem o repositório, escrevem o código, correm os testes e abrem o pull request. Isto muda a forma como construímos software e o tipo de produtos que os nossos clientes nos pedem.', 'Coding assistants used to complete lines. Today’s agents take a task, read the repository, write the code, run the tests and open the pull request. That changes how we build software and the kind of products our clients ask us for.'),
        take: [L('Um agente trabalha em ciclos: planeia, executa, verifica e corrige.', 'An agent works in loops: plan, execute, verify and correct.'), L('O trabalho do developer passa a ser especificar bem, rever com rigor e decidir a arquitetura.', 'The developer’s job becomes writing good specs, reviewing rigorously and owning the architecture.'), L('Testes, permissões e revisão humana são o que torna um agente seguro em produção.', 'Tests, permissions and human review are what make an agent safe in production.')],
        body: [
          p(L('Há um ano escrevi sobre como a IA ajuda a criar o próximo projeto. Desde então as ferramentas deram um salto. Já não falamos de sugestões no editor. Falamos de agentes que trabalham durante minutos ou horas numa tarefa, com acesso ao terminal, ao repositório e à documentação, e que devolvem trabalho pronto para rever.', 'A year ago I wrote about how AI helps you create your next project. Since then the tools have taken a leap. We are no longer talking about suggestions in the editor. We are talking about agents that work for minutes or hours on a task, with access to the terminal, the repository and the docs, and hand back work ready for review.')),
          h(L('O que é um agente, na prática', 'What an agent is, in practice')),
          p(L('Um modelo de linguagem responde a uma pergunta. Um agente usa esse modelo dentro de um ciclo, com ferramentas à disposição, até atingir um objetivo:', 'A language model answers a question. An agent uses that model inside a loop, with tools at hand, until it reaches a goal:')),
          ol([L('Percebe a tarefa e o contexto: lê ficheiros, tickets e documentação.', 'Understands the task and context: reads files, tickets and docs.'), L('Faz um plano e divide-o em passos.', 'Makes a plan and breaks it into steps.'), L('Executa: edita código, corre comandos, chama APIs.', 'Executes: edits code, runs commands, calls APIs.'), L('Verifica o resultado com testes, linters ou o próprio browser.', 'Checks the result with tests, linters or the browser itself.'), L('Corrige o que falhou e repete até a tarefa estar feita ou precisar de ajuda.', 'Fixes what failed and repeats until the task is done or it needs help.')]),
          p(L('A diferença está no passo quatro. Um agente que consegue verificar o próprio trabalho entrega com muito menos supervisão.', 'The difference lies in step four. An agent that can check its own work delivers with far less supervision.')),
          h(L('Como mudou o nosso dia a dia', 'How our day-to-day has changed')),
          p(L('Na Betacode usamos agentes em quase todos os projetos. Tarefas bem delimitadas, como uma migração de dependências, um novo endpoint com testes, a cobertura de um módulo antigo ou um ecrã a partir de um design, são entregues a um agente. A equipa revê, ajusta e decide o que entra.', 'At Betacode we use agents on almost every project. Well-scoped tasks, like a dependency migration, a new endpoint with tests, coverage for an old module or a screen built from a design, go to an agent. The team reviews, adjusts and decides what gets merged.')),
          ul([L('Vários agentes podem trabalhar em paralelo em ramos diferentes.', 'Several agents can work in parallel on different branches.'), L('Tarefas que ficavam sempre para depois, como testes e documentação, passam a ser feitas.', 'Tasks that were always pushed back, like tests and docs, actually get done.'), L('Um developer consegue acompanhar mais frentes de trabalho ao mesmo tempo.', 'One developer can keep more workstreams moving at once.'), L('O tempo da equipa vai para arquitetura, produto e conversas com o cliente.', 'The team’s time goes into architecture, product and conversations with the client.')]),
          h(L('O novo papel do developer', 'The developer’s new role')),
          p(L('Quem trabalha bem com agentes tem três competências que já eram importantes e agora pesam ainda mais.', 'People who work well with agents have three skills that already mattered and now matter even more.')),
          ul([L('Especificar: descrever a tarefa, os limites e o critério de "feito" com clareza. Uma boa especificação vale mais do que um bom prompt.', 'Specifying: describing the task, its limits and the definition of done clearly. A good spec is worth more than a good prompt.'), L('Rever: ler código que não escreveu e encontrar o que está subtilmente errado. A revisão é onde se ganha ou perde qualidade.', 'Reviewing: reading code you didn’t write and spotting what is subtly wrong. Review is where quality is won or lost.'), L('Decidir a arquitetura: os agentes seguem os padrões que encontram. Se a base for confusa, multiplicam a confusão.', 'Owning the architecture: agents follow the patterns they find. If the codebase is messy, they multiply the mess.')]),
          q(L('Os agentes escrevem cada vez mais código. A responsabilidade por esse código continua a ser nossa.', 'Agents write more and more of the code. Responsibility for that code is still ours.')),
          h(L('Como trabalhamos com agentes em segurança', 'How we work with agents safely')),
          ol([L('Tarefas pequenas e bem delimitadas, com um critério de aceitação escrito.', 'Small, well-scoped tasks with a written acceptance criterion.'), L('Testes como contrato: se os testes passam e cobrem o comportamento certo, temos confiança no resultado.', 'Tests as the contract: if tests pass and cover the right behaviour, we can trust the result.'), L('Permissões mínimas: o agente acede só ao que precisa, sem credenciais de produção.', 'Least privilege: the agent accesses only what it needs, with no production credentials.'), L('Revisão humana obrigatória antes de qualquer merge.', 'Mandatory human review before any merge.'), L('Pipelines de CI que bloqueiam o que não cumpre as regras do projeto.', 'CI pipelines that block anything that breaks the project’s rules.')]),
          note(L('Uma regra simples', 'A simple rule'), L('Tratamos o trabalho de um agente como o de um novo membro da equipa muito rápido: confiamos no processo, não no autor.', 'We treat an agent’s work like that of a very fast new team member: we trust the process, not the author.')),
          h(L('Agentes dentro dos produtos', 'Agents inside products')),
          p(L('A outra metade da mudança está nos produtos que construímos. Cada vez mais clientes querem funcionalidades agênticas: um assistente que marca reuniões, prepara propostas, responde a clientes com base nos dados da empresa ou automatiza um processo de back-office de ponta a ponta.', 'The other half of the shift is in the products we build. More and more clients want agentic features: an assistant that books meetings, drafts proposals, answers customers from company data or automates a back-office process end to end.')),
          ul([L('Ferramentas bem definidas: o agente só pode fazer o que as APIs expostas permitem. Protocolos como o MCP tornam esta ligação mais simples.', 'Well-defined tools: the agent can only do what the exposed APIs allow. Protocols like MCP make that connection simpler.'), L('Humano no circuito para ações com impacto: pagamentos, envios a clientes, alterações de dados.', 'A human in the loop for high-impact actions: payments, messages to customers, data changes.'), L('Observabilidade: registar cada passo para perceber porque é que o agente fez o que fez.', 'Observability: log every step to understand why the agent did what it did.'), L('Avaliações contínuas: um conjunto de casos de teste que corre a cada alteração do prompt ou do modelo.', 'Continuous evals: a set of test cases that runs on every prompt or model change.')]),
          note(L('Exemplo: Coach ID', 'Example: Coach ID'), L('O assistente da Coach ID começou por responder a perguntas. O passo seguinte é ajudar o treinador a montar um plano de treino completo a partir dos objetivos da equipa, com o treinador a aprovar cada sessão.', 'The Coach ID assistant started by answering questions. The next step is helping coaches assemble a full training plan from the team’s goals, with the coach approving each session.')),
          h(L('O que isto significa para quem quer construir', 'What this means if you want to build')),
          p(L('O custo de pôr uma primeira versão no ar caiu muito. Isso é uma boa notícia para fundadores e empresas. Também significa que a vantagem passa para quem sabe o que construir, valida depressa com utilizadores reais e mantém uma base de código saudável à medida que o produto cresce.', 'The cost of getting a first version live has dropped a lot. That is good news for founders and companies. It also means the advantage shifts to those who know what to build, validate quickly with real users and keep a healthy codebase as the product grows.')),
          p(L('Os princípios que seguimos há dez anos continuam a servir: começar pelo problema, lançar pequeno, medir e decidir. Os agentes deixam-nos percorrer esse ciclo mais vezes no mesmo tempo.', 'The principles we have followed for ten years still hold: start with the problem, launch small, measure and decide. Agents let us run that loop more times in the same amount of time.')),
          q(L('A era agêntica premeia equipas com bom critério. Ferramentas qualquer um tem.', 'The agentic era rewards teams with good judgement. Anyone can have the tools.'))
        ] },
      cofounder: {
        file: 'ArtCofounder.dc.html', cat: 'ven', by: 'pedro', mins: 8, date: L('28 out 2025', 'Oct 28, 2025'), glyph: '{B}', code: 'founders.push("tech");\n// visão + execução',
        title: L('Porque as startups precisam de um co-fundador técnico', 'Why startups need a technical co-founder'),
        lead: L('Tem a visão e conhece o problema melhor do que ninguém. Mas sem alguém que assuma a tecnologia como sua, acaba a gerir fornecedores em vez de construir uma empresa.', 'You have the vision and know the problem better than anyone. But without someone who owns the technology, you end up managing vendors instead of building a company.'),
        take: [L('Freelancers e agências entregam tarefas, não responsabilidade pelo produto.', 'Freelancers and agencies deliver tasks, not ownership of the product.'), L('Um co-fundador técnico partilha o risco e decide a arquitetura a pensar no longo prazo.', 'A technical co-founder shares the risk and makes architecture calls for the long term.'), L('A Betacode Ventures entra desde o primeiro dia, em troca de equity.', 'Betacode Ventures joins from day one, in exchange for equity.')],
        body: [
          p(L('Ao longo dos anos conhecemos centenas de fundadores. A maioria não tem falta de ambição nem de ideias. O que lhes falta é um parceiro técnico que trate o produto como seu: que tome as decisões de arquitetura, que conteste as más ideias, que lance o MVP e que fique quando as coisas correm mal.', 'Over the years we have met hundreds of founders. Most are not short of ambition or ideas. What they lack is a technical partner who treats the product as their own: someone who makes the architecture calls, challenges bad ideas, ships the MVP and stays when things go wrong.')),
          h(L('A armadilha dos freelancers', 'The freelancer trap')),
          p(L('Os freelancers são ótimos para tarefas pontuais: uma landing page, uma integração, a correção de um bug. Mas não substituem um co-fundador. Não conhecem os seus utilizadores, não se preocupam com o seu runway e saem quando aparece um projeto melhor. Entregam trabalho, não responsabilidade.', 'Freelancers are great for one-off tasks: a landing page, an integration, a bug fix. But they are no substitute for a co-founder. They don’t know your users, don’t worry about your runway and leave when a better project comes along. They deliver output, not accountability.')),
          p(L('As agências também encaixam mal numa startup em fase inicial. Constroem o que está na especificação, faturam ao mês e seguem em frente. Não há risco partilhado. E quando a especificação está errada, o que no início acontece quase sempre, é o fundador que paga e recomeça.', 'Agencies are also a poor fit for an early-stage startup. They build what is in the spec, bill monthly and move on. There is no shared risk. And when the spec is wrong, which early on it almost always is, the founder pays and starts over.')),
          h(L('O que faz, na prática, um co-fundador técnico', 'What a technical co-founder actually does')),
          ul([L('Define o roadmap do produto com o fundador de negócio, em vez de apenas executar tickets.', 'Shapes the product roadmap with the business founder, rather than just executing tickets.'), L('Escolhe a stack e a arquitetura a pensar na escala, mas sem exagerar no início.', 'Chooses the stack and architecture with scale in mind, without over-engineering early on.'), L('Lança o MVP e itera com base em feedback real, não em suposições.', 'Ships the MVP and iterates on real feedback, not assumptions.'), L('Aconselha sobre construir ou comprar, dívida técnica e quando pivotar.', 'Advises on build vs. buy, technical debt and when to pivot.'), L('Ajuda a contratar e a orientar os primeiros engenheiros internos.', 'Helps hire and mentor the first in-house engineers.'), L('Conta aos investidores uma história técnica credível.', 'Tells investors a credible technical story.')]),
          h(L('O problema da escassez', 'The scarcity problem')),
          p(L('Bons co-fundadores técnicos são difíceis de encontrar. Normalmente já estão a construir os seus próprios projetos ou têm equity comprometida noutro lado. Contratar um antes de haver tração é quase impossível. E dar 30 a 50% da empresa a alguém que conheceu num evento de networking é uma aposta que a maioria dos fundadores não está pronta para fazer.', 'Good technical co-founders are hard to find. They are usually building their own projects or have equity tied up elsewhere. Hiring one before there is traction is almost impossible. And giving 30 to 50% of the company to someone you met at a networking event is a bet most founders are not ready to make.')),
          h(L('A lacuna que a Betacode Ventures veio preencher', 'The gap Betacode Ventures was created to fill')),
          p(L('Eu e o Marco construímos a nossa primeira startup, a Wishmood, com competências complementares: visão de negócio de um lado, execução técnica do outro. Foi essa parceria que nos permitiu aprender depressa, pivotar e, mais tarde, criar a Betacode.', 'Marco and I built our first startup, Wishmood, with complementary skills: business vision on one side, technical execution on the other. That partnership let us learn fast, pivot and, later, start Betacode.')),
          q(L('A Betacode Ventures existe para dar a outros fundadores o parceiro técnico que nós tivemos um no outro.', 'Betacode Ventures exists to give other founders the technical partner we had in each other.')),
          h(L('Como funciona', 'How it works')),
          ol([L('Validar e planear: antes de escrever código, identificamos a suposição mais arriscada, os primeiros utilizadores e a versão mínima útil.', 'Validate and plan: before writing code, we identify the riskiest assumption, the first users and the minimum useful version.'), L('Construir e lançar: uma equipa full-stack dedicada trata da arquitetura, do backend, do frontend, da infraestrutura e do deploy.', 'Build and launch: a dedicated full-stack team handles architecture, backend, frontend, infrastructure and deployment.'), L('Iterar e escalar: recolhemos feedback, entregamos melhorias e, quando o produto estiver provado, ajudamos a trazer talento para dentro de casa.', 'Iterate and scale: we gather feedback, ship improvements and, once the product is proven, help bring talent in-house.')]),
          note(L('O caso Coach ID', 'The Coach ID case'), L('O primeiro projeto da Betacode Ventures: uma plataforma feita por treinadores de futebol para treinadores de futebol, reconstruída de raiz depois de 8 anos no mercado. Na primeira semana teve mais de 100 clientes.', 'The first Betacode Ventures project: a platform built by football coaches for football coaches, rebuilt from scratch after 8 years on the market. In its first week it had more than 100 customers.')),
          h(L('É para si?', 'Is it right for you?')),
          p(L('Não é para todas as startups. Faz sentido para fundadores com conhecimento do domínio e um problema claro, que precisam de liderança técnica para validar, construir e escalar. Se ainda está a explorar uma ideia vaga sem utilizador-alvo, o melhor começo é uma conversa, não uma parceria.', 'It is not for every startup. It makes sense for founders with domain knowledge and a clear problem who need technical leadership to validate, build and scale. If you are still exploring a vague idea with no target user, the best start is a conversation, not a partnership.'))
        ] },
      stack: {
        file: 'ArtStack.dc.html', cat: 'eng', by: 'marco', mins: 9, date: L('17 jun 2026', 'Jun 17, 2026'), glyph: 'TS', code: 'const stack = [\n  "next", "nest", "ts"\n];',
        title: L('Construir aplicações com JavaScript/TypeScript como base', 'Building applications with JavaScript/TypeScript as the backbone'),
        lead: L('Usamos JavaScript e TypeScript em quase tudo: frontend, backend, APIs, ferramentas e scripts de infraestrutura. Não é uma questão de gosto. É a forma mais rápida de pôr um produto nas mãos de utilizadores com uma equipa que se consegue contratar.', 'We use JavaScript and TypeScript for almost everything: frontend, backend, APIs, tooling and infrastructure scripts. It is not a matter of taste. It is the fastest way to put a product in users’ hands with a team you can actually hire.'),
        take: [L('Uma só linguagem permite que uma pessoa leve uma funcionalidade de ponta a ponta.', 'One language lets one person take a feature end to end.'), L('Next.js e NestJS dão velocidade sem sacrificar estrutura.', 'Next.js and NestJS give speed without sacrificing structure.'), L('Para produtos web, SaaS e ferramentas internas, JS/TS é o melhor ponto de partida.', 'For web products, SaaS and internal tools, JS/TS is the best default.')],
        body: [
          p(L('Já trabalhámos com Python, Java e PHP. Mas quando uma startup precisa de um MVP depressa, ou uma empresa tradicional precisa de modernizar sem contratar várias equipas especializadas, uma stack unificada ganha quase sempre.', 'We have worked with Python, Java and PHP. But when a startup needs an MVP fast, or a traditional company needs to modernise without hiring several specialised teams, a unified stack almost always wins.')),
          h(L('Deploys rápidos', 'Fast deployment')),
          ul([L('Plataformas como Vercel e Netlify fazem deploy de apps Next.js a cada commit, sem configurar servidores.', 'Platforms like Vercel and Netlify deploy Next.js apps on every commit, with no servers to set up.'), L('Backends NestJS ficam em containers e correm em qualquer cloud com pipelines de CI/CD normais.', 'NestJS backends containerise cleanly and run on any cloud with standard CI/CD pipelines.'), L('Ambientes de pré-visualização por pull request deixam o cliente ver as alterações antes de irem para produção.', 'Per-pull-request preview environments let clients review changes before they reach production.')]),
          h(L('Frameworks que escalam: Next.js e NestJS', 'Frameworks that scale: Next.js and NestJS')),
          p(L('No frontend, o Next.js dá-nos renderização no servidor, geração estática, React Server Components e rotas de API para lógica simples. No backend, o NestJS traz uma arquitetura organizada em módulos, controladores e serviços, tipagem de raiz e suporte para REST, GraphQL, WebSockets e filas de mensagens.', 'On the frontend, Next.js gives us server rendering, static generation, React Server Components and API routes for simple logic. On the backend, NestJS brings an architecture organised into modules, controllers and services, first-class typing and support for REST, GraphQL, WebSockets and message queues.')),
          p(L('Esta combinação também nos ajuda a partir monólitos em serviços modulares: frontend e backend evoluem de forma independente, mas partilham a linguagem e as definições de tipos.', 'This combination also helps us break monoliths into modular services: frontend and backend evolve independently but share the language and type definitions.')),
          h(L('Equipas full-stack que custam menos', 'Full-stack teams that cost less')),
          ul([L('Um developer pode ser dono de uma funcionalidade inteira: query, endpoint, componente e deploy.', 'One developer can own a whole feature: query, endpoint, component and deploy.'), L('Tipos partilhados entre frontend e backend eliminam uma classe inteira de bugs de integração.', 'Shared types between frontend and backend eliminate a whole class of integration bugs.'), L('Equipas mais pequenas significam menos burn rate para startups.', 'Smaller teams mean a lower burn rate for startups.'), L('O onboarding é mais rápido porque só há uma stack para aprender.', 'Onboarding is faster because there is only one stack to learn.')]),
          h(L('Comunidade e talento', 'Community and talent')),
          p(L('O npm tem mais de dois milhões de pacotes para autenticação, pagamentos, analytics, PDFs ou integrações de IA. A documentação de Next.js, NestJS, React e Node.js é extensa e mantida. Uma comunidade grande reduz o risco do projeto: stacks de nicho tendem a desaparecer.', 'npm has over two million packages for authentication, payments, analytics, PDFs or AI integrations. The documentation for Next.js, NestJS, React and Node.js is extensive and maintained. A large community lowers project risk: niche stacks tend to fade.')),
          p(L('Em Portugal há uma base forte e crescente de developers JS/TS, vindos de universidades, bootcamps ou autodidatas. Isso facilita contratar, escalar e, mais tarde, internalizar a equipa na mesma stack.', 'Portugal has a strong and growing base of JS/TS developers, from universities, bootcamps or self-taught. That makes it easier to hire, scale and, later, bring the team in-house on the same stack.')),
          h(L('Aplicações responsivas e dinâmicas', 'Responsive, dynamic applications')),
          p(L('O modelo de componentes do React mantém interfaces complexas sob controlo, e as Progressive Web Apps dão uma experiência de app a partir do browser, sem lojas de aplicações.', 'React’s component model keeps complex interfaces manageable, and Progressive Web Apps deliver an app-like experience from the browser, without app stores.')),
          note(L('Exemplo: Coach ID', 'Example: Coach ID'), L('A Coach ID é uma PWA construída nesta stack. Os treinadores usam-na no telemóvel em campo, no computador no escritório e no tablet durante o treino, sem versões nativas separadas.', 'Coach ID is a PWA built on this stack. Coaches use it on their phone on the pitch, on desktop at the office and on a tablet during training, with no separate native builds.')),
          h(L('Uma stack, muitos contextos', 'One stack, many contexts')),
          p(L('Ciência de dados, sistemas embebidos ou trading de alta frequência precisam de ferramentas especializadas. Mas para aplicações web, plataformas SaaS, marketplaces e ferramentas internas, JS/TS continua a ser a melhor escolha por defeito.', 'Data science, embedded systems or high-frequency trading need specialised tools. But for web apps, SaaS platforms, marketplaces and internal tools, JS/TS remains the strongest default.')),
          q(L('A pergunta certa não é qual a linguagem mais elegante. É qual leva o produto aos utilizadores mais depressa, com uma equipa que consegue contratar, numa plataforma que escala.', 'The right question is not which language is most elegant. It is which one gets the product to users fastest, with a team you can hire, on a platform that scales.'))
        ] },
      lean: {
        file: 'ArtLean.dc.html', cat: 'biz', by: 'pedro', mins: 10, date: L('16 jun 2026', 'Jun 16, 2026'), glyph: '↻', code: 'build()\n  .measure()\n  .learn();',
        title: L('Porque o Lean Startup é a pedra de Rosetta da Betacode', 'Why Lean Startup is Betacode’s Rosetta Stone'),
        lead: L('Começámos com uma ideia, um protótipo e muitas suposições. A nossa primeira startup não se tornou um unicórnio, mas ensinou-nos a construir em incerteza, a matar más ideias depressa e a ouvir o mercado.', 'We started with an idea, a prototype and a lot of assumptions. Our first startup did not become a unicorn, but it taught us to build under uncertainty, kill bad ideas fast and listen to the market.'),
        take: [L('"As pessoas querem isto" e "as pessoas pagam o suficiente por isto" são coisas muito diferentes.', '"People want this" and "people pay enough for this" are very different claims.'), L('Construir, medir, aprender: o inimigo do lean é a certeza, não a ambição.', 'Build, measure, learn: the enemy of lean is certainty, not ambition.'), L('Construir ficou mais barato; construir a coisa errada não.', 'Building got cheaper; building the wrong thing did not.')],
        body: [
          h(L('O que aprendemos com a Wishmood', 'What we learned building Wishmood')),
          p(L('A Wishmood era uma app de entregas on-demand para praias, eventos ao ar livre e sítios onde as apps tradicionais não chegavam: comida entregue na espreguiçadeira, no piquenique ou na tenda do festival. A ideia vinha de uma observação real. Quem estava na praia queria comida, e os restaurantes próximos não tinham um canal digital.', 'Wishmood was an on-demand delivery app for beaches, outdoor events and places traditional apps did not reach: food delivered to your sunbed, picnic or festival tent. The idea came from a real observation. Beachgoers wanted food, and nearby restaurants had no digital channel.')),
          p(L('Construímos depressa: app, onboarding de restaurantes, logística e pagamentos. Mas percebemos que entregar não é o mesmo que aprender.', 'We built fast: app, restaurant onboarding, logistics and payments. But we learned that shipping is not the same as learning.')),
          ul([L('Assumimos procura durante todo o ano, e ela era fortemente sazonal.', 'We assumed year-round demand, and it was strongly seasonal.'), L('Construímos funcionalidades antes de saber se os restaurantes aguentavam as horas de ponta.', 'We built features before knowing whether restaurants could handle rush hours.'), L('Otimizámos a app antes de provar que a economia unitária funcionava.', 'We optimised the app before proving the unit economics worked.'), L('Nas entrevistas, as pessoas adoravam a ideia. O uso real contava outra história.', 'In interviews people loved the idea. Real usage told another story.')]),
          q(L('"As pessoas querem isto" e "as pessoas pagam o suficiente para isto ser um negócio" são afirmações muito diferentes.', '"People want this" and "people pay enough for this to be a business" are very different claims.')),
          h(L('De fundadores a facilitadores', 'From founders to enablers')),
          p(L('Em 2016 fundámos a Betacode com uma pergunta: se os métodos lean nos ajudaram a aprender mais depressa, podiam ajudar outras empresas a fazer o mesmo? Hoje isso está em tudo o que fazemos: no desenvolvimento de MVPs, na consultoria técnica centrada no que construir primeiro e na Betacode Ventures, onde investimos a nossa equipa e deixamos o mercado decidir.', 'In 2016 we founded Betacode around a question: if lean methods helped us learn faster, could they help other companies do the same? Today it runs through everything we do: MVP development, technical consulting focused on what to build first, and Betacode Ventures, where we invest our team and let the market decide.')),
          note(L('A prova: Coach ID', 'The proof: Coach ID'), L('Oito anos de conhecimento do domínio e milhares de treinadores. Em vez de remendar a plataforma antiga, reconstruímo-la de raiz. Na primeira semana chegou a utilizadores reais e validou a proposta de valor com clientes pagantes.', 'Eight years of domain knowledge and thousands of coaches. Instead of patching the old platform, we rebuilt it from scratch. In its first week it reached real users and validated its value proposition with paying customers.')),
          h(L('O que é lean startup, na prática', 'What lean startup means in practice')),
          ol([L('Construir: lançar a versão mais pequena que testa a suposição mais arriscada.', 'Build: ship the smallest version that tests the riskiest assumption.'), L('Medir: recolher dados de utilizadores reais, não opiniões de reuniões.', 'Measure: collect data from real users, not opinions from meetings.'), L('Aprender: decidir se persiste, pivota ou para.', 'Learn: decide whether to persevere, pivot or stop.')]),
          h(L('Como o aplicamos', 'How we apply it')),
          p(L('Startups: defina a suposição mais arriscada antes de programar, quase sempre "alguém vai pagar?". Lance com um fluxo principal, não com uma matriz de funcionalidades, e fale com utilizadores todas as semanas.', 'Startups: define the riskiest assumption before coding, almost always "will anyone pay?". Launch with one core workflow, not a feature matrix, and talk to users every week.')),
          p(L('Empresas tecnológicas: valide novas linhas de produto com protótipos antes de comprometer uma equipa durante seis meses, e meça resultados (retenção, receita, tickets de suporte), não output.', 'Tech companies: validate new product lines with prototypes before committing a team for six months, and measure outcomes (retention, revenue, support tickets), not output.')),
          p(L('Empresas tradicionais: comece pelo problema de negócio, não por uma lista de desejos tecnológicos. Faça um piloto num departamento e mantenha os sistemas antigos a funcionar enquanto o novo prova o seu valor.', 'Traditional companies: start with the business problem, not a technology wish list. Pilot in one department and keep the old systems running while the new one proves itself.')),
          h(L('Os erros que vemos repetidamente', 'The mistakes we keep seeing')),
          ul([L('Construir às escondidas: seis meses isolados e um lançamento que ninguém pediu.', 'Stealth build: six months in isolation and a launch nobody asked for.'), L('Fábrica de funcionalidades: lançar sem parar sem ver se o uso ou a receita mudaram.', 'Feature factory: shipping nonstop without checking whether usage or revenue moved.'), L('Arquitetura perfeita: meses de infraestrutura antes de um utilizador tocar no produto.', 'Perfect architecture: months of infrastructure before any user touches the product.'), L('Especificação por comité: 50 páginas escritas por quem não vai usar o software.', 'Committee spec: 50 pages written by people who won’t use the software.'), L('Custo afundado: continuar porque "já investimos tanto".', 'Sunk cost: carrying on because "we have already invested so much".')]),
          h(L('Porque continua a importar em 2026', 'Why it still matters in 2026')),
          p(L('A IA escreve código mais depressa e a infraestrutura cloud aparece em minutos. O custo de construir caiu. O custo de construir a coisa errada não, e talvez tenha subido, porque hoje é possível lançar más ideias mais depressa do que nunca.', 'AI writes code faster and cloud infrastructure appears in minutes. The cost of building has dropped. The cost of building the wrong thing has not, and may have risen, because you can now ship bad ideas faster than ever.')),
          q(L('Qual é a suposição mais arriscada? Qual é a coisa mais pequena que a testa? O que dizem os dados? Persistimos ou pivotamos? É esta a nossa pedra de Rosetta.', 'What is the riskiest assumption? What is the smallest thing that tests it? What do the data say? Persevere or pivot? That is our Rosetta Stone.'))

      legacy: {
        file: 'ArtLegacy.dc.html', cat: 'eng', by: 'marco', mins: 11, date: L('15 jun 2026', 'Jun 15, 2026'), glyph: '⟳', code: 'monolith\n  .split()\n  .migrate();',
        title: L('Como transformar software legacy num produto moderno', 'How to transform legacy software into a modern product'),
        lead: L('Ninguém escolhe ter software legacy. Vai-se acumulando até cada funcionalidade demorar mais, cada deploy parecer arriscado e contratar developers ficar mais difícil. A boa notícia: não precisa de uma reescrita total.', 'Nobody chooses legacy software. It builds up until every feature takes longer, every deploy feels risky and hiring developers gets harder. The good news: you don’t need a full rewrite.'),
        take: [L('Evite reescritas big-bang: evolua o produto por partes.', 'Avoid big-bang rewrites: evolve the product in slices.'), L('Use a infraestrutura como ponte entre o sistema antigo e o novo.', 'Use infrastructure as the bridge between old and new.'), L('Cada fatia deve chegar a produção em 4 a 8 semanas.', 'Each slice should reach production in 4 to 8 weeks.')],
        body: [
          h(L('Quando o software e a infraestrutura estão ambos atrasados', 'When software and infrastructure are both behind')),
          p(L('Legacy não é só código antigo. É a stack toda:', 'Legacy is not just old code. It is the whole stack:')),
          ul([L('Aplicação: monólitos, dependências desatualizadas, sem testes, funcionalidades muito acopladas.', 'Application: monoliths, outdated dependencies, no tests, tightly coupled features.'), L('Dados: esquemas antigos, índices em falta, lógica de negócio escondida em stored procedures.', 'Data: old schemas, missing indexes, business logic buried in stored procedures.'), L('Infraestrutura: servidores físicos ou cloud antiga, deploys manuais, sem staging igual a produção.', 'Infrastructure: bare metal or early cloud, manual deploys, no staging that mirrors production.'), L('Operações: equipas a apagar fogos e releases trimestrais porque cada uma mete medo.', 'Operations: teams firefighting and quarterly releases because each one is feared.')]),
          h(L('Partir o monólito em partes geríveis', 'Breaking the monolith into manageable parts')),
          p(L('O monólito não é mau por si. O problema são as tabelas partilhadas e as dependências implícitas que tornam qualquer mudança arriscada. O objetivo não é ter microserviços por ter. É identificar contextos delimitados: faturação, gestão de utilizadores, relatórios ou o fluxo que os clientes usam todos os dias.', 'The monolith is not bad in itself. The problem is shared tables and implicit dependencies that make any change risky. The goal is not microservices for their own sake. It is finding bounded contexts: billing, user management, reporting or the workflow customers use every day.')),
          ol([L('Mapear o sistema: o que existe, quem o usa e onde dói mais.', 'Map the system: what exists, who uses it and where it hurts most.'), L('Encontrar as costuras naturais: módulos com poucas dependências.', 'Find the natural seams: modules with few dependencies.'), L('Extrair uma fatia de cada vez, começando por algo valioso mas isolado.', 'Extract one slice at a time, starting with something valuable but isolated.'), L('Definir interfaces claras: APIs, eventos ou contratos partilhados.', 'Define clear interfaces: APIs, events or shared contracts.'), L('Manter o monólito a funcionar enquanto os novos serviços assumem responsabilidades.', 'Keep the monolith running while new services take on responsibilities.')]),
          h(L('Refazer funcionalidades é uma decisão de produto', 'Rebuilding features is a product decision')),
          p(L('Reconstruir uma funcionalidade não é traduzir código. É a oportunidade de questionar cada ecrã, campo e passo. Fale com utilizadores e com o suporte antes de programar, simplifique fluxos que acumularam "só mais um campo", escreva testes para a nova versão e corra os dois sistemas em paralelo até confiar na paridade.', 'Rebuilding a feature is not translating code. It is the chance to question every screen, field and step. Talk to users and support before coding, simplify workflows that piled up "just one more field", write tests for the new version and run both systems in parallel until you trust parity.')),
          note(L('Exemplo: Coach ID', 'Example: Coach ID'), L('Oito anos de feedback do mercado foram condensados numa reconstrução de raiz que manteve o que funcionava e deixou para trás o que não funcionava.', 'Eight years of market feedback were condensed into a ground-up rebuild that kept what worked and left behind what didn’t.')),
          p(L('Escolha tecnologia que a equipa consiga operar em produção, não a mais recente: uma PWA em vez de um cliente só para desktop, bases de dados geridas em vez de servidores que ninguém mantém, deploys automáticos em vez de uploads por FTP.', 'Choose technology the team can run in production, not the newest: a PWA instead of a desktop-only client, managed databases instead of servers nobody maintains, automated deploys instead of FTP uploads.')),
          h(L('A infraestrutura como ponte', 'Infrastructure as the bridge')),
          p(L('Os dois sistemas vão conviver durante meses. A infraestrutura torna isso invisível para os utilizadores:', 'Both systems will live side by side for months. Infrastructure makes that invisible to users:')),
          ul([L('Reverse proxies (nginx, Traefik, Cloudflare) encaminham o tráfego para o sistema antigo ou novo por URL, feature flag ou segmento.', 'Reverse proxies (nginx, Traefik, Cloudflare) route traffic to old or new by URL, feature flag or segment.'), L('Load balancers permitem deploys sem downtime e rollback imediato.', 'Load balancers allow zero-downtime deploys and instant rollback.'), L('API gateways centralizam autenticação, rate limiting e routing.', 'API gateways centralise authentication, rate limiting and routing.'), L('Filas de mensagens deixam os dois sistemas falar sem acoplamento.', 'Message queues let both systems talk without tight coupling.'), L('Feature flags libertam para uma percentagem de utilizadores antes da mudança total.', 'Feature flags release to a share of users before full cutover.')]),
          q(L('É o padrão strangler fig: o sistema novo vai envolvendo e substituindo o antigo, ramo a ramo, sem que o utilizador mude de URL.', 'This is the strangler fig pattern: the new system gradually wraps and replaces the old one, branch by branch, without users changing URL.')),
          h(L('Dividir para conquistar, mas manter-se lean', 'Divide and conquer, but stay lean')),
          ol([L('Escolha a fatia de maior impacto e menor risco.', 'Pick the highest-impact, lowest-risk slice.'), L('Defina um prazo firme: 4 a 8 semanas até a primeira fatia estar em produção.', 'Set a hard deadline: 4 to 8 weeks until the first slice is live.'), L('Mantenha uma equipa pequena e dedicada.', 'Keep a small, dedicated squad.'), L('Meça resultados: frequência de deploy, incidentes, satisfação e tempo até à próxima funcionalidade.', 'Measure outcomes: deploy frequency, incidents, satisfaction and time to the next feature.'), L('Celebre cada migração como progresso real.', 'Celebrate each cutover as real progress.')]),
          h(L('Por onde começar', 'Where to start')),
          p(L('Comece por uma auditoria honesta e identifique o maior custo: releases lentas, rotação de developers, queixas dos clientes ou faturas de infraestrutura. Depois escolha a dor que corresponde a uma fatia isolável do produto e construa a ponte.', 'Start with an honest audit and find the biggest cost: slow releases, developer turnover, customer complaints or infrastructure bills. Then pick the pain that maps to an isolable product slice and build the bridge.'))
        ] },
      mvp: {
        file: 'ArtMvp.dc.html', cat: 'start', by: 'pedro', mins: 10, date: L('12 nov 2025', 'Nov 12, 2025'), glyph: '▲', code: 'idea → mvp → live',
        title: L('Como construir um MVP em 3 meses', 'How to build an MVP in 3 months'),
        lead: L('A maioria dos fundadores não falha por ter uma má ideia. Falha porque passa seis meses a construir a coisa errada, ou doze a construir algo que ninguém pediu. Três meses é tempo suficiente para construir algo real e ainda ter runway para agir sobre o que aprende.', 'Most founders don’t fail because the idea is bad. They fail because they spend six months building the wrong thing, or twelve building something nobody asked for. Three months is enough to build something real and still have runway to act on what you learn.'),
        take: [L('Um plano curto e partilhado vale mais do que uma especificação de 200 páginas.', 'A short, shared plan beats a 200-page spec.'), L('Corte tudo o que não seja indispensável para o fluxo principal.', 'Cut everything that isn’t essential to the core workflow.'), L('O prazo é o próprio método.', 'The deadline is the method.')],
        body: [
          h(L('Porque três meses', 'Why three months')),
          ul([L('Preserva o runway: um limite de tempo controla o burn rate.', 'Preserves runway: a time limit keeps burn under control.'), L('Acelera a aprendizagem: utilizadores reais dizem cedo se deve persistir, pivotar ou parar.', 'Speeds up learning: real users tell you early whether to persevere, pivot or stop.'), L('Dá vantagem competitiva sobre quem ainda está a fazer wireframes no sexto mês.', 'Gives you an edge over those still wireframing in month six.'), L('Muda a conversa com investidores: "lançámos há seis semanas, estes são os números".', 'Changes investor conversations: "we launched six weeks ago, here are the numbers".'), L('Mata o scope creep: cada funcionalidade tem de merecer o seu lugar.', 'Kills scope creep: every feature has to earn its place.')]),
          h(L('1. Comece com um plano escrito', '1. Start with a written plan')),
          p(L('Curto e partilhado: o problema, o percurso principal do utilizador, a abordagem técnica, uma lista do que construir e outra do que não construir, as métricas de sucesso e quem decide o quê. Na Betacode, criamo-lo com o fundador nas duas primeiras semanas.', 'Short and shared: the problem, the core user journey, the technical approach, a build list and a don’t-build list, success metrics and who decides what. At Betacode we co-create it with the founder in the first two weeks.')),
          h(L('2. Identifique o essencial', '2. Identify the essentials')),
          ul([L('Se tirar a funcionalidade torna o produto inútil, construa.', 'If removing a feature makes the product useless, build it.'), L('Se só o torna menos conveniente, adie.', 'If it only makes it less convenient, defer it.'), L('Se só importa em escala, espere pela escala.', 'If it only matters at scale, wait for scale.'), L('Se nenhum utilizador o pediu, não construa.', 'If no user asked for it, don’t build it.')]),
          note(L('Exemplo: Coach ID', 'Example: Coach ID'), L('O MVP focou-se numa coisa: deixar os treinadores planear e conduzir os treinos semanais. Pagamentos, assistente de IA, painel de administração e editor de exercícios vieram depois de o fluxo principal estar validado.', 'The MVP focused on one thing: letting coaches plan and run weekly training. Payments, the AI assistant, the admin dashboard and the drill editor came after the core loop was validated.')),
          h(L('3. Marcos de duas em duas semanas', '3. Two-week milestones')),
          ol([L('Semanas 1–2: plano fechado, arquitetura definida, ambiente pronto.', 'Weeks 1–2: plan locked, architecture set, environment ready.'), L('Semanas 3–4: modelos de dados e endpoints do fluxo principal.', 'Weeks 3–4: data models and endpoints for the core flow.'), L('Semanas 5–6: frontend ligado ao backend, fluxo completo em staging.', 'Weeks 5–6: frontend wired to backend, full flow in staging.'), L('Semanas 7–8: testes internos e correção de bugs críticos.', 'Weeks 7–8: internal testing and critical bug fixes.'), L('Semanas 9–10: produção, monitorização e primeiros utilizadores.', 'Weeks 9–10: production, monitoring and first users.'), L('Semanas 11–12: feedback, correções e a decisão de persistir ou pivotar.', 'Weeks 11–12: feedback, fixes and the persevere-or-pivot decision.')]),
          p(L('Demos semanais de software a funcionar (não slides), bloqueios escalados ao fim de um dia e um fundador sempre contactável. Esperar três dias por uma decisão de produto mata o ritmo.', 'Weekly demos of working software (not slides), blockers escalated after a day and a founder who is always reachable. Waiting three days for a product decision kills momentum.')),
          h(L('4. A IA como acelerador', '4. AI as an accelerator')),
          p(L('A IA não substitui a equipa, mas comprime o trabalho repetitivo: scaffolding, endpoints CRUD, esquemas, testes e documentação. As pessoas continuam a decidir a arquitetura, a experiência e o debugging em produção. O tempo poupado vira mais polimento ou um lançamento a tempo.', 'AI doesn’t replace the team, but it compresses repetitive work: scaffolding, CRUD endpoints, schemas, tests and docs. People still own architecture, experience and production debugging. The time saved becomes extra polish or an on-time launch.')),
          h(L('O que mata um prazo de três meses', 'What kills a three-month timeline')),
          ul([L('"Já agora…": cada acrescento custa semanas.', '"While we’re at it…": every addition costs weeks.'), L('Perfeccionismo no design, na arquitetura ou nos nomes.', 'Perfectionism in design, architecture or naming.'), L('Construir às escondidas, sem falar com utilizadores.', 'Building in stealth, without talking to users.'), L('A equipa errada: freelancers que desaparecem ou agências à hora.', 'The wrong team: disappearing freelancers or hourly agencies.'), L('Não ter métricas, ou defender o produto em vez de ouvir.', 'No metrics, or defending the product instead of listening.')]),
          q(L('Três meses chegam para construir algo real, lançá-lo e perceber se a ideia tem tração. O prazo é o método.', 'Three months is enough to build something real, launch it and learn whether the idea has traction. The deadline is the method.'))

        body: [

          p(L('O resultado são equipas mais pequenas a produzir o que antes exigia equipas maiores.', 'The result is smaller teams producing what used to take larger ones.')),

          p(L('Quando construir fica barato, a tentação de construir o que ninguém pediu aumenta. Por isso aplicamos o lean startup ao desenvolvimento: as horas poupadas vão para entrevistas, testes com protótipos e decisões de produto.', 'When building gets cheap, the temptation to build what nobody asked for grows. That is why we apply lean startup to development: the hours saved go into interviews, prototype tests and product decisions.')),
          ul([L('Comece pelo problema do utilizador, não pela lista de funcionalidades.', 'Start with the user’s problem, not the feature list.'), L('Valide antes de automatizar.', 'Validate before automating.'), L('Meça resultados, não output.', 'Measure outcomes, not output.'), L('Corte funcionalidades cedo: manter o que não é preciso continua a custar.', 'Cut features early: keeping what isn’t needed still costs.')]),
          h(L('Menos esforço nos detalhes, mais no essencial', 'Less effort on details, more on the core')),
          p(L('A IA trata bem da configuração do projeto, de CRUD normal, documentação, componentes de interface, migrações e integrações standard. As pessoas continuam donas da arquitetura, da direção do produto, da experiência do utilizador, do debugging em produção e da segurança.', 'AI handles project setup, standard CRUD, documentation, UI components, migrations and standard integrations well. People still own architecture, product direction, user experience, production debugging and security.')),
          note(L('Na prática', 'In practice'), L('Uma equipa que gastava 60% do tempo em infraestrutura e código repetitivo pode baixar para 20%, e dedicar o resto às funcionalidades e à experiência.', 'A team that spent 60% of its time on infrastructure and boilerplate can bring that down to 20%, and put the rest into features and experience.')),
          h(L('A IA num MVP de três meses', 'AI in a three-month MVP')),
          ol([L('Semanas 1–2: setup, scaffolding da arquitetura e primeiros endpoints.', 'Weeks 1–2: setup, architecture scaffolding and first endpoints.'), L('Semanas 3–6: a equipa foca-se no fluxo principal; a IA trata de testes, docs e integrações.', 'Weeks 3–6: the team focuses on the core flow; AI handles tests, docs and integrations.'), L('Semanas 7–8: ajuda na correção de bugs e refactoring.', 'Weeks 7–8: help with bug fixes and refactoring.'), L('Semanas 9–12: o lançamento foca-se em onboarding e feedback.', 'Weeks 9–12: launch focuses on onboarding and feedback.')]),
          note(L('Exemplo: Coach ID', 'Example: Coach ID'), L('A Coach ID foi lançada com um assistente virtual de IA usado todos os dias pelos treinadores. Sem estas ferramentas, teria exigido uma equipa de machine learning dedicada e meses extra.', 'Coach ID launched with an AI virtual assistant coaches use every day. Without these tools it would have needed a dedicated machine learning team and extra months.')),
          h(L('O que a IA não muda', 'What AI doesn’t change')),
          p(L('A IA é um multiplicador, não uma varinha mágica. Uma equipa a construir o produto errado mais depressa está pior do que uma a construir o certo devagar. Continua a ser preciso um plano de produto, developers experientes a rever e decidir a arquitetura, conversas diretas com utilizadores e a disciplina de lançar e medir.', 'AI is a multiplier, not a magic wand. A team building the wrong product faster is worse off than one building the right product slowly. You still need a product plan, experienced developers to review and decide architecture, direct conversations with users and the discipline to launch and measure.')),
          q(L('A IA torna-nos mais rápidos. O método torna-nos focados. A stack torna-nos consistentes.', 'AI makes us faster. The method keeps us focused. The stack keeps us consistent.'))

    const REL = { agentic: ['ai', 'stack'], cofounder: ['mvp', 'lean'], stack: ['ai', 'legacy'], lean: ['mvp', 'cofounder'], legacy: ['stack', 'lean'], mvp: ['cofounder', 'ai'], ai: ['agentic', 'stack'] };

    const cta = (A.cat === 'ven' || A.cat === 'start')
      ? { k: '// betacode ventures', h: L('Tem a visão mas precisa de um co-fundador técnico?', 'Have the vision but need a technical co-founder?'), p: L('Sem custos de desenvolvimento: entramos no capital e construímos o produto consigo.', 'No development fees: we take equity and build the product with you.'), btn: L('Explorar Betacode Ventures', 'Explore Betacode Ventures'), href: links.ventures }
