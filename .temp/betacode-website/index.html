<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betacode — Homepage</title>
<link rel="icon" href="assets/brand/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1C51}a:hover{color:#D8402F}
.site{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-width:0;transition:background .25s,color .25s}
.site a{color:var(--text)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.mono[aria-hidden="true"]{white-space:nowrap;flex:none}
.disp{font-family:'Montserrat',system-ui,sans-serif}
.navlink{color:var(--text) !important;text-decoration:none;font-size:15px;font-weight:500;padding:12px 2px;border-bottom:2px solid transparent}
.navlink:hover{border-bottom-color:#EB5648}
.flink{color:var(--fm) !important;text-decoration:none;font-size:15px;padding:8px 0}
.flink:hover{color:var(--ft) !important}
.btn-coral{background:#D8402F;color:#FFFFFF !important;text-decoration:none;font-weight:600;border-radius:12px;display:flex;align-items:center;gap:10px;transition:background .2s}
.btn-coral:hover{background:#BF3424}
.btn-navy{background:#1B1C51;color:#FFFFFF !important;text-decoration:none;font-weight:600;border-radius:12px;display:flex;align-items:center;gap:10px}
.btn-navy:hover{background:#0B0C26}
.btn-ghost{border:1.5px solid var(--text);color:var(--text) !important;text-decoration:none;font-weight:600;border-radius:12px;display:flex;align-items:center}
.btn-ghost:hover{background:var(--surface)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;cursor:pointer;background:transparent;color:var(--muted);font:600 13px/1 'JetBrains Mono',monospace;min-width:44px;min-height:38px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{appearance:none;cursor:pointer;border:0;background:var(--surface);color:var(--text);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{outline:1.5px solid var(--text)}
.tab{appearance:none;cursor:pointer;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:#E6E6F4;font:600 15px/1 'Inter',sans-serif;padding:0 20px;min-height:48px;border-radius:12px;display:flex;align-items:center;gap:10px}
.tab:hover{border-color:#FFFFFF;color:#FFFFFF}
.card{text-decoration:none;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.14)}
.card:hover .arrow{color:#EB5648}
.logo-cell img{filter:var(--logo-filter);opacity:.8;transition:opacity .2s, filter .2s}
.logo-cell:hover img{filter:var(--logo-filter-hover);opacity:1}
.team-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:300px;gap:14px}
.team-grid img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}
.span2{grid-column:span 2}
.tall{grid-row:span 2}
.an-panel{flex:1 1 380px;min-height:380px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background-color:var(--surface);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:18px 18px}
.an-stage{position:relative;width:100%;max-width:340px;height:300px}
.an-chip{font:500 12px/1 'JetBrains Mono',monospace;background:#1B1C51;color:#fff;padding:8px 12px;border-radius:999px;white-space:nowrap;display:inline-block}
.an-cap{font:500 12px/1 'JetBrains Mono',monospace;color:var(--muted)}
.an-paper{position:absolute;left:0;width:64px;height:84px;background-color:#fff;background-image:repeating-linear-gradient(transparent 0 12px,#D9DAE8 12px 13px);background-position:0 10px;background-size:70% 100%;background-repeat:no-repeat;background-origin:content-box;padding:0 10px;box-sizing:border-box;border:1px solid #E2E2EC;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.08);opacity:0;animation:an-fly 4.8s ease-in-out infinite}
@keyframes an-fly{0%{transform:translateX(0) rotate(-8deg);opacity:0}8%{opacity:1}42%{transform:translateX(170px) rotate(6deg) scale(.4);opacity:0}100%{transform:translateX(170px) scale(.4);opacity:0}}
.an-screen{position:absolute;right:0;top:24px;width:200px;height:232px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.14);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.an-dots{display:flex;gap:5px;margin-bottom:4px}.an-dots span{width:8px;height:8px;border-radius:50%;background:var(--border)}.an-dots span:first-child{background:#EB5648}
.an-row{height:10px;border-radius:5px;background:var(--barc);opacity:.3;transform-origin:left;animation:an-row 4.8s ease-out infinite}
.an-row.k{background:#EB5648;opacity:.9}
@keyframes an-row{0%,25%{transform:scaleX(0)}48%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.an-bars{margin-top:auto;display:flex;align-items:flex-end;gap:8px;height:84px}
.an-bars i{flex:1;background:var(--barc);border-radius:4px 4px 0 0;transform-origin:bottom;animation:an-grow 4.8s ease-out infinite}
.an-bars i:last-child{background:#EB5648}
@keyframes an-grow{0%,40%{transform:scaleY(0)}66%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.an-team{position:absolute;left:0;right:0;top:34px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;justify-items:center}
.an-av{width:58px;height:58px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--barc);box-sizing:border-box}
.an-av.new{background:#EB5648;border-color:#EB5648;color:#fff;opacity:0;animation:an-join 5s cubic-bezier(.2,.8,.2,1) infinite}
.an-av.new.d2{animation-delay:.35s}
@keyframes an-join{0%,12%{transform:translateX(160px) scale(.6);opacity:0}32%,86%{transform:none;opacity:1}100%{transform:scale(.6);opacity:0}}
.an-pop{opacity:0;animation:an-pop 5s ease-out infinite}
@keyframes an-pop{0%,38%{transform:translateY(10px) scale(.8);opacity:0}48%,86%{transform:none;opacity:1}100%{opacity:0}}
.an-node{position:absolute;top:0;width:64px;height:64px;border-radius:50%;background:var(--card);border:2px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.an-node.n1{left:0;animation:an-lit1 6s linear infinite}.an-node.n2{left:calc(50% - 32px);animation:an-lit2 6s linear infinite}.an-node.n3{right:0;animation:an-lit3 6s linear infinite}
@keyframes an-lit1{0%,96%{border-color:#EB5648;color:#EB5648}97%,100%{border-color:var(--border);color:var(--muted)}}
@keyframes an-lit2{0%,32%{border-color:var(--border);color:var(--muted)}36%,96%{border-color:#EB5648;color:#EB5648}97%,100%{border-color:var(--border);color:var(--muted)}}
@keyframes an-lit3{0%,66%{border-color:var(--border);color:var(--muted)}70%,96%{border-color:#EB5648;color:#EB5648;background:#EB5648;color:#fff}97%,100%{border-color:var(--border);color:var(--muted)}}
.an-track{position:absolute;left:32px;right:32px;top:31px;height:2px;background:var(--border)}
.an-track i{position:absolute;inset:0;background:#EB5648;transform-origin:left;animation:an-line 6s linear infinite}
@keyframes an-line{0%{transform:scaleX(0)}70%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.an-trav{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:#EB5648;box-shadow:0 0 0 6px rgba(235,86,72,.22);animation:an-trav 6s linear infinite}
@keyframes an-trav{0%{left:-6px;opacity:1}70%{left:calc(100% - 6px);opacity:1}75%,100%{left:calc(100% - 6px);opacity:0}}
.an-lbl{position:absolute;top:76px;width:90px;text-align:center}
.an-card{position:absolute;left:10px;right:10px;bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
.an-prog{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.an-prog i{display:block;height:100%;background:#EB5648;transform-origin:left;animation:an-line 6s ease-in-out infinite}
.an-ok{color:#1F9D5C;opacity:0;animation:an-ok 6s linear infinite;font-weight:700}
@keyframes an-ok{0%,70%{opacity:0}74%,96%{opacity:1}100%{opacity:0}}
.an-seg{animation:an-draw 5s ease-in-out infinite}
.an-seg.s2{animation-delay:.5s}
@keyframes an-draw{0%,8%{stroke-dasharray:0px 440px}40%,88%{stroke-dasharray:var(--len) 440px}100%{stroke-dasharray:0px 440px}}
.an-side{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
.an-side.l{animation:an-inL 5s ease-out infinite}.an-side.r{animation:an-inR 5s ease-out infinite}
@keyframes an-inL{0%,5%{transform:translateX(-40px);opacity:0}25%,88%{transform:none;opacity:1}100%{opacity:0}}
@keyframes an-inR{0%,5%{transform:translateX(40px);opacity:0}25%,88%{transform:none;opacity:1}100%{opacity:0}}
.an-meet{position:absolute;left:0;right:0;top:40px;display:flex;align-items:center;justify-content:center;gap:18px}
.an-who{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
.an-who.l{animation:an-mL 5.5s cubic-bezier(.3,.7,.2,1) infinite}.an-who.r{animation:an-mR 5.5s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes an-mL{0%,4%{transform:translateX(-70px);opacity:0}16%{transform:translateX(-40px);opacity:1}38%,88%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@keyframes an-mR{0%,4%{transform:translateX(70px);opacity:0}16%{transform:translateX(40px);opacity:1}38%,88%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.an-hs{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.an-hs .ico{width:84px;height:84px;border-radius:50%;background:#EB5648;color:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);animation:an-hs 5.5s ease-out infinite}
@keyframes an-hs{0%,38%{transform:scale(0) rotate(-20deg)}46%{transform:scale(1.18) rotate(6deg)}50%{transform:scale(.95) rotate(-4deg)}54%{transform:scale(1.04) rotate(3deg)}58%,88%{transform:scale(1) rotate(0)}100%{transform:scale(0)}}
.an-hs .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #EB5648;opacity:0;animation:an-ring 5.5s ease-out infinite}
.an-hs .ring.b{animation-delay:.18s}
@keyframes an-ring{0%,42%{transform:scale(.8);opacity:0}44%{opacity:.9}64%,100%{transform:scale(1.9);opacity:0}}
.an-deal{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.an-deal span{opacity:0;animation:an-pop2 5.5s ease-out infinite}
.an-deal span:nth-child(2){animation-delay:.15s}
@keyframes an-pop2{0%,56%{transform:translateY(10px);opacity:0}64%,88%{transform:none;opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.an-hs .ico{transform:none}.an-panel *{animation:none !important;opacity:1 !important}}
.blogo{display:flex;align-items:center;gap:6px;height:40px}
.blogo-mark{position:relative;width:39px;height:40px;flex:none}
.bm-bin,.bm-fill{position:absolute;inset:0;-webkit-mask:url(assets/brand/mark.png) center/contain no-repeat;mask:url(assets/brand/mark.png) center/contain no-repeat;transition:opacity .3s ease}
.bm-bin{background:var(--binbg);color:var(--text);font:700 4.4px/4.6px 'JetBrains Mono',monospace;word-break:break-all;overflow:hidden}
.bm-fill{background:#EB5648}
.blogo-word{position:relative;width:109px;height:40px;flex:none}
@font-face{font-family:'BcDigits';src:url(assets/fonts/bc-digits.ttf) format('truetype');font-weight:400;font-display:swap}
.blogo-word img{position:absolute;inset:0;width:100%;height:100%;display:block}
.bw-d{position:absolute;top:47%;transform:translate(-50%,-50%);font:400 21px/1 'BcDigits','DejaVu Sans',sans-serif;color:var(--text);white-space:nowrap}
.logo-static{display:none}
@media (prefers-reduced-motion:reduce){.logo-anim{display:none !important}.logo-static{display:block}}
@keyframes bc-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{display:inline-block;color:#EB5648;animation:bc-blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
@media (max-width:760px){.team-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:220px}}
@media (max-width:760px){.hide-sm{display:none !important}.hero-h{font-size:44px !important}.sec-h{font-size:34px !important}.pad-sm{padding:32px 24px !important}}
</style>
<style>html,body{margin:0}#root{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<template id="dc-tpl">
<div class="site" style="{{rootStyle}}">

  <!-- NAV -->
  <header style="position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border)">
    <nav aria-label="{{t.navLabel}}" style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap">
      <a href="{{base}}" aria-label="Betacode" style="display: flex; align-items: center; min-height: 44px">
        <img class="logo-anim" src="assets/brand/logo-animated.gif" alt="Betacode" style="{{logoAnimStyle}}">
        <img class="logo-static" src="{{logo}}" alt="Betacode" style="height: 34px; width: auto">
      </a>
      <div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
        <a class="navlink" href="{{base}}">{{t.navHome}}</a>
        <a class="navlink" href="{{links.pricing}}">{{t.navPricing}}</a>
        <a class="navlink" href="{{links.ventures}}">Betacode Ventures</a>
        <a class="navlink" href="{{links.insights}}">Insights</a>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="seg" role="group" aria-label="{{t.langLabel}}">
          <button aria-pressed="{{isPt}}" onClick="{{setPt}}">PT</button>
          <button aria-pressed="{{isEn}}" onClick="{{setEn}}">EN</button>
        </div>
        <button class="iconbtn" aria-label="{{t.themeLabel}}" onClick="{{toggleTheme}}">
          <sc-if value="{{dark}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </sc-if>
          <sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </button>
        <a class="btn-coral" href="{{links.contact}}" style="font-size: 15px; padding: 0 20px; min-height: 44px">{{t.navContact}}</a>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section style="position: relative; overflow: hidden">
    <div aria-hidden="true" class="mono hide-sm" style="position: absolute; left: -40px; top: 40px; font-size: 520px; line-height: 1; font-weight: 700; color: var(--ghost)">{</div>
    <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 80px 24px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
      <div style="flex: 999 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <div class="mono" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; font-size: 13px; color: var(--text); background: var(--surface); padding: 8px 14px; border-radius: 999px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #EB5648"></span>
          {{t.heroChip}}
        </div>
        <h1 class="disp hero-h" style="margin: 0; font-size: 74px; line-height: 1.03; font-weight: 800; letter-spacing: -0.035em"><span class="mono" style="color: #EB5648; font-weight: 700">{</span>Software<span class="mono" style="color: #EB5648; font-weight: 700">}</span> {{t.heroL1}}</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.6; color: var(--muted); max-width: 560px">{{t.heroSub}}</p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
          <a class="btn-coral" href="{{links.contact}}" style="font-size: 16px; padding: 0 26px; min-height: 54px">{{t.heroCta}} <span aria-hidden="true">→</span></a>
          <a class="btn-ghost" href="{{links.pricing}}" style="font-size: 16px; padding: 0 26px; min-height: 54px">{{t.heroCta2}}</a>
          <a href="#servicos" style="text-underline-offset: 5px; font-weight: 500; font-size: 16px; padding: 0 10px; min-height: 54px; display: flex; align-items: center">{{t.heroCta3}}</a>
        </div>
      </div>

      <div style="flex: 1 1 420px; min-width: 0; display: flex; align-items: center; justify-content: center">
        <div class="mono" aria-hidden="true" style="width: 100%; max-width: 500px; background: var(--term); color: #E6E6F4; border-radius: 20px; padding: 22px 26px 26px; box-shadow: 0 30px 70px rgba(0,0,0,0.28); font-size: 14px; line-height: 1.85; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.08)">
          <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 14px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #EB5648"></span>
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #4A4B7A"></span>
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #4A4B7A"></span>
            <span style="margin-left: auto; font-size: 12px; color: #8F90B8">{{termTitle}}</span>
          </div>
          <div style="height: 280px; overflow: hidden; display: flex; flex-direction: column">
            <sc-for list="{{termLines}}" as="ln" hint-placeholder-count="4">
              <div style="white-space: pre-wrap; word-break: break-word; color: {{ln.color}}"><span style="color: {{ln.pc}}">{{ln.p}}</span>{{ln.t}}</div>
            </sc-for>
            <div style="white-space: pre-wrap; word-break: break-word; color: {{typing.color}}"><span style="color: {{typing.pc}}">{{typing.p}}</span>{{typing.t}}<span class="cursor">▍</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CLIENTS -->
  <section aria-labelledby="clientes-h" style="background: var(--surface)">
    <div style="max-width: 1240px; margin: 0 auto; padding: 44px 24px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center">
      <h2 id="clientes-h" class="disp" style="margin: 0; font-size: 16px; font-weight: 700; flex: 0 0 auto; max-width: 220px; line-height: 1.4">{{t.clientsTitle}}</h2>
      <ul style="list-style: none; margin: 0; padding: 0; flex: 1 1 640px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px">
        <sc-for list="{{clients}}" as="c" hint-placeholder-count="6">
          <li class="logo-cell" style="height: 76px; background: var(--card); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 14px 18px; box-sizing: border-box">
            <img src="{{c.src}}" alt="{{c.name}}" style="max-width: 100%; max-height: {{c.h}}; object-fit: contain; display: block">
          </li>
        </sc-for>
      </ul>
    </div>
  </section>

  <!-- SERVICES / AUDIENCE TABS -->
  <section id="servicos" aria-labelledby="servicos-h" style="background: var(--band); color: #FFFFFF; position: relative; overflow: hidden">
    <div aria-hidden="true" class="mono hide-sm" style="position: absolute; right: -30px; top: -60px; font-size: 420px; line-height: 1; font-weight: 700; color: rgba(255,255,255,0.04)">}</div>
    <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 112px 24px">
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 700px; margin-bottom: 40px">
        <span class="mono" style="font-size: 13px; color: #FF8A7D; letter-spacing: 0.04em">{{t.svcKicker}}</span>
        <h2 id="servicos-h" class="disp sec-h" style="margin: 0; font-size: 52px; line-height: 1.06; font-weight: 800; letter-spacing: -0.03em">{{t.svcTitle}}</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #C9CAE6">{{t.svcSub}}</p>
      </div>

      <div role="tablist" aria-label="{{t.svcTabsLabel}}" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px">
        <sc-for list="{{tracks}}" as="tr" hint-placeholder-count="4">
          <button class="tab" role="tab" aria-selected="{{tr.selected}}" onClick="{{tr.pick}}" style="{{tr.tabStyle}}">
            <span class="mono" style="font-size: 12px; opacity: 0.75">{{tr.num}}</span>{{tr.label}}
          </button>
        </sc-for>

<script type="text/x-dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'trad', lang: null, theme: null };
    this.anim = { s: 0, l: 0, c: 0, done: [] };
    this.curLang = 'pt';
    this.lg = { bits: this.rbits(420), digits: '01100101'.split(''), lastD: 0, lastB: 0 };
  }
  rbits(n) { let s = ''; for (let i = 0; i < n; i++) s += Math.random() < 0.5 ? '0' : '1'; return s; }
  logoView(dark) {
    // Timing matches the GIF: 142 frames x 40ms
    const T = 5680;
    const t = this.logoStill ? 3200 : ((Date.now() - (this.logoT0 || Date.now())) % T);
    const ramp = (a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
    const fill = t < 4600 ? ramp(1150, 1320) : 1 - ramp(4700, 4950);
    // letter boundaries of the BETACODE wordmark, in % of its width
    const B = [0, 12.8, 24.4, 36.1, 49.1, 61.7, 76.2, 89.5, 100];
    const slots = this.lg.digits.map((c, i) => {
      const rIn = 1920 + i * 140, rOut = 3520 + i * 80;
      const isLetter = t >= rIn && t < rOut;
      const glow = isLetter && t - rIn < 260;
      const fresh = !isLetter && t >= rOut && t - rOut < 160;
      const L = B[i], R = 100 - B[i + 1];
      const clip = 'inset(-20% ' + R.toFixed(1) + '% -20% ' + L.toFixed(1) + '%)';
      return {
        c,
        imgStyle: 'clip-path: ' + clip + '; -webkit-clip-path: ' + clip + '; opacity: ' + (isLetter ? 1 : 0) + (glow ? '; filter: drop-shadow(0 0 4px rgba(235,86,72,0.85))' : ''),
        dStyle: 'left: ' + ((B[i] + B[i + 1]) / 2).toFixed(1) + '%; opacity: ' + (isLetter ? 0 : (fresh ? 0.45 : 1))
      };
    });
    return {
      root: '--binbg: ' + (dark ? 'rgba(255,255,255,0.12)' : 'rgba(27,28,81,0.08)'),
      bits: this.lg.bits,
      binOp: (1 - fill).toFixed(2),
      fillOp: fill.toFixed(2),

      this.anim = { s: 0, l: S.lines.length, c: 0, done: S.lines.slice(), still: true };

    const step = () => {
      const A = this.anim;
      const all = this.sessions(this.curLang);
      const S = all[A.s % all.length];
      let wait = 40;
      if (A.l >= S.lines.length) {

          wait = 500;
        } else { A.hold = true; wait = 2600; }
      } else {

        if (ln[0] === 'o' || ln[0] === 'ok') {
          A.done.push(ln); A.l += 1; wait = 260;
        } else if (A.c < ln[1].length) {
          A.c += 1; wait = 22 + Math.random() * 70;

        }
