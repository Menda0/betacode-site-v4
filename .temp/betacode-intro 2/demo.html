<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betacode — demo da intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- 1) Configuração (opcional) — antes do script -->
<script>
  var lang = new URLSearchParams(location.search).get('lang');
  window.BetacodeIntroConfig = { mode: 'once', lang: lang || null };
</script>
<!-- 2) CSS + JS da intro, no <head>, sem defer/async -->
<link rel="stylesheet" href="betacode-intro.css">
<script src="betacode-intro.min.js"></script>

<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1B1C51;background:#fff}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #E6E6EF;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
  header img{height:34px}
  main{max-width:960px;margin:0 auto;padding:96px 24px}
  h1{font:800 56px/1.05 Montserrat,sans-serif;letter-spacing:-.03em;margin:0 0 16px}
  h1 span{color:#EB5648}
  p{font-size:18px;line-height:1.6;color:#4A4B7A}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}
  button{appearance:none;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:0 20px;font:600 15px Inter,sans-serif;background:#D8402F;color:#fff}
  button.alt{background:#1B1C51}
  code{font-family:'JetBrains Mono',monospace;background:#F4F4F8;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<header><img src="assets/mark.png" alt="Betacode"><span style="font:500 13px 'JetBrains Mono',monospace;color:#B83324">// demo</span></header>
<main>
  <h1><span>{</span>Software<span>}</span> que transforma o seu negócio.</h1>
  <p>Página de demonstração. A intro aparece só na primeira visita neste browser. Usa os botões para a voltar a ver.</p>
  <div class="row">
    <button onclick="BetacodeIntro.start({ force: true })">Repetir intro</button>
    <button class="alt" onclick="BetacodeIntro.start({ force: true, lang: 'en' })">Repetir em inglês</button>
    <button class="alt" onclick="BetacodeIntro.reset(); location.reload()">Esquecer e recarregar</button>
  </div>
  <p style="margin-top:40px">Evento no fim: <code id="ev">à espera…</code></p>
</main>
<script>
  document.addEventListener('betacode:intro-done', function () {
    document.getElementById('ev').textContent = 'betacode:intro-done às ' + new Date().toLocaleTimeString();
  });
</script>
</body>
</html>
